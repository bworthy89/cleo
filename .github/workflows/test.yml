# CI on push — three parallel jobs so client tests, server build/tests, and
# root typecheck each surface failures independently without waiting on the
# others.
#
# Not yet here (tracked in docs/index.md NEXT):
#   - Root lint (`eslint src/`): blocked on `eslint-plugin-react-hooks` install
#     + a triage pass on the 25 no-explicit-any / unused-var warnings.

name: test

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  client-tests:
    name: Client jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  client-typecheck:
    name: Client typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  server-tests:
    name: Server build + jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: cd server && npm ci
      - run: cd server && npm run build  # tsc emit serves as server typecheck
      - run: cd server && npm test
