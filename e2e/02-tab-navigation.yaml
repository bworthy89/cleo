appId: com.worthymedia.cleo
name: Tab Navigation - all tabs accessible
---
- launchApp

# Default tab is Broadcast
- assertVisible: "LIVE BROADCAST"

# Navigate to Arc tab
- tapOn: "Arc"
- assertVisible: "Start a broadcast to see your session arc"

# Navigate to Archive tab
- tapOn: "Archive"
- assertVisible: "BROADCAST ARCHIVES"

# Navigate to ONAY tab
- tapOn: "ONAY"
- assertVisible: "ONAY SAYS"
- assertVisible: "AI PERSONALITY"

# Navigate back to Broadcast
- tapOn: "Broadcast"
- assertVisible: "LIVE BROADCAST"
