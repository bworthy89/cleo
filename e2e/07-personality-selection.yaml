appId: com.worthymedia.cleo
name: Personality Selection - can switch AI personality
---
- launchApp
- tapOn: "ONAY"

- scrollUntilVisible:
    element: "AI PERSONALITY"
    direction: DOWN

# Select The Companion
- tapOn: "The Companion"

# Select The Oracle
- tapOn: "The Oracle"

# Select back to The Curator
- tapOn: "The Curator"
