appId: com.worthymedia.cleo
name: Station Creation - playlist tap opens vibe picker
---
- launchApp

# Scroll to playlists
- scrollUntilVisible:
    element: "PLAYLISTS"
    direction: DOWN

# Tap on a station card (accessibility label starts with "Station:")
- tapOn: "Station:.*"

# Vibe picker should appear
- assertVisible: "Choose a Vibe"
