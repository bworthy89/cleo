# CI on push — four parallel jobs so client tests, server build/tests,
# typecheck, and lint each surface failures independently without waiting on
# the others.
#
# Lint runs at default warning threshold (warnings allowed, errors fail). The
# 20 remaining warnings are all `no-explicit-any` at API/event boundaries —
# intentional, accepted as documented in docs/index.md.

name: test

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  client-tests:
    name: Client jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  client-typecheck:
    name: Client typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint (client + server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  server-tests:
    name: Server build + jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: cd server && npm ci
      - run: cd server && npm run build  # tsc emit serves as server typecheck
      - run: cd server && npm test
