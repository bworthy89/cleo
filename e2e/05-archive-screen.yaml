appId: com.worthymedia.cleo
name: Archive Screen - renders with filter tabs
---
- launchApp
- tapOn: "Archive"

# Header
- assertVisible: "BROADCAST ARCHIVES"

# Filter tabs
- assertVisible: "Latest"
- assertVisible: "By Mood"
- assertVisible: "By Date"

# Tab switching
- tapOn: "By Mood"
- tapOn: "By Date"
- tapOn: "Latest"
